name: Migração WebDiet → Scanner da Saúde

on:
  workflow_dispatch:
    inputs:
      nutri_id:
        description: 'ID da nutricionista no Scanner (deixe em branco para usar o padrão)'
        required: false
        default: ''
      delay_ms:
        description: 'Delay entre pacientes em ms (padrão: 3000)'
        required: false
        default: '3000'

jobs:
  migrate:
    name: Executar migração
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 horas — suficiente para ~1.600 pacientes

    defaults:
      run:
        working-directory: tools/webdiet-migrator

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tools/webdiet-migrator/package.json

      - name: Instalar dependências
        run: npm install

      - name: Instalar Chromium (Playwright)
        run: npx playwright install chromium --with-deps

      - name: Criar .env com credenciais
        env:
          WEBDIET_EMAIL: ${{ secrets.WEBDIET_EMAIL }}
          WEBDIET_PASSWORD: ${{ secrets.WEBDIET_PASSWORD }}
          SCANNER_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SCANNER_SUPABASE_SERVICE_ROLE_KEY }}
          NUTRI_SECRETS_ID_INPUT: ${{ inputs.nutri_id }}
        run: |
          NUTRI_ID="${NUTRI_SECRETS_ID_INPUT:-f0813032-f6cf-4b36-9339-4c5d16293e25}"
          cat > .env <<EOF
          WEBDIET_URL=https://pt.webdiet.com.br
          WEBDIET_EMAIL=${WEBDIET_EMAIL}
          WEBDIET_PASSWORD=${WEBDIET_PASSWORD}
          SCANNER_SUPABASE_URL=https://sjxrikjgxflzccrrirux.supabase.co
          SCANNER_SUPABASE_SERVICE_ROLE_KEY=${SCANNER_SUPABASE_SERVICE_ROLE_KEY}
          NUTRI_SECRETS_ID=${NUTRI_ID}
          HEADLESS=true
          DELAY_MS=${{ inputs.delay_ms }}
          DOWNLOADS_PATH=./downloads
          LOG_PATH=./logs
          EOF

      - name: Executar migração
        run: npm start

      - name: Salvar logs como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-logs-${{ github.run_number }}
          path: tools/webdiet-migrator/logs/
          retention-days: 30
