name: Migração WebDiet → Scanner da Saúde

on:
  workflow_dispatch:
    inputs:
      nutri_id:
        description: 'ID da nutricionista no Scanner (deixe em branco para usar o padrão)'
        required: false
        default: ''
      delay_ms:
        description: 'Delay entre pacientes em ms (padrão: 3000)'
        required: false
        default: '3000'

jobs:
  migrate:
    name: Executar migração
    runs-on: ubuntu-latest
    timeout-minutes: 360

    defaults:
      run:
        working-directory: tools/webdiet-migrator

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: tools/webdiet-migrator/package.json

      - name: Instalar dependências
        run: npm install

      - name: Instalar Chromium (Playwright)
        run: npx playwright install chromium --with-deps

      - name: Criar .env com credenciais
        env:
          WEBDIET_EMAIL: ${{ secrets.WEBDIET_EMAIL }}
          WEBDIET_PASSWORD: ${{ secrets.WEBDIET_PASSWORD }}
          SCANNER_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SCANNER_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          NUTRI_ID="${{ inputs.nutri_id }}"
          NUTRI_ID="${NUTRI_ID:-f0813032-f6cf-4b36-9339-4c5d16293e25}"
          {
            echo "WEBDIET_URL=https://pt.webdiet.com.br"
            echo "WEBDIET_EMAIL=$WEBDIET_EMAIL"
            echo "WEBDIET_PASSWORD=$WEBDIET_PASSWORD"
            echo "SCANNER_SUPABASE_URL=https://sjxrikjgxflzccrrirux.supabase.co"
            echo "SCANNER_SUPABASE_SERVICE_ROLE_KEY=$SCANNER_SUPABASE_SERVICE_ROLE_KEY"
            echo "NUTRI_SECRETS_ID=$NUTRI_ID"
            echo "HEADLESS=true"
            echo "DELAY_MS=${{ inputs.delay_ms }}"
            echo "DOWNLOADS_PATH=./downloads"
            echo "LOG_PATH=./logs"
          } > .env
          echo "✅ .env criado com $(wc -l < .env) linhas"
          echo "Variáveis presentes: $(grep -c '=' .env)"

      - name: Executar migração
        run: npm start

      - name: Salvar logs como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-logs-${{ github.run_number }}
          path: |
            tools/webdiet-migrator/logs/
          retention-days: 30
